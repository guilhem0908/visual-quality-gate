name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU wheels of PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests on synthetic data (no dataset, no pretrained weights)
        run: pytest -m "not dataset"
      - name: Recompute the summary and the trade-off figure from the committed scores
        run: python scripts/reproduce.py --stages report
      - name: README numbers match the results
        run: python scripts/check_readme.py
